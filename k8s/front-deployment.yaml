
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: gcirineu18/prettycake-frontend:1.0.0
          ports:
            - containerPort: 5173
          envFrom:
            - secretRef:
                name: pretty-secrets
                  