spring.application.name=backend


spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://db:5432/pretty-cake-db}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:postgrescake}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public

security.jwt.secret=${JWT_SECRET:7Z4/ixOoIRj48XHPDdY2FIXEWLUWHYl7UU9lmVDlhzo=}

# Spring Cloud AWS
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY:myaccesskey}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS:mysecretkey}
spring.cloud.aws.credentials.session-token=${AWS_SESSION_TOKEN:mytoken}

front.url=${FRONTEND_URL:http://localhost:5173}

# --- MINIO CONFIGURATION
minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
minio.access-key=${MINIO_ACCESS_KEY:-minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:-minioadmin123}
minio.bucket.name=cloud-ufc-bucket2

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_DEFAULT_HOST:-localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER:-myuser}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS:-secret}
queue.name=pretty-queue
