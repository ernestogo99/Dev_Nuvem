apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker
  name: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  strategy: {}
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - image: gcirineu18/prettycake-api:1.0.2
        name: worker
        envFrom:
          - secretRef:
              name: pretty-secrets  
        resources: {}
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: worker
status: {}
