# Backend Profile - API Server Configuration
spring.application.name=backend-api
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/pretty-cake-db}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:postgrescake}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public

# Security
security.jwt.secret=${JWT_SECRET:7Z4/ixOoIRj48XHPDdY2FIXEWLUWHYl7UU9lmVDlhzo=}

# Spring Cloud AWS
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY:myaccesskey}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS:mysecretkey}
spring.cloud.aws.credentials.session-token=${AWS_SESSION_TOKEN:mytoken}

# Frontend URL for CORS
front.url=${FRONTEND_URL:http://localhost:5173}

spring.rabbitmq.listener.auto-startup=false

spring.devtools.restart.enabled=false
