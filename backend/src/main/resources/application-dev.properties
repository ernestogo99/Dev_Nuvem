# application-dev.properties - Development Profile

# PostgreSQL - conecta ao container via localhost
spring.datasource.url=jdbc:postgresql://localhost:5432/pretty-cake-db
spring.datasource.username=postgres
spring.datasource.password=postgrescake

# MinIO - conecta ao container via localhost
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin123

# RabbitMQ - conecta ao container via localhost
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=myuser
spring.rabbitmq.password=secret